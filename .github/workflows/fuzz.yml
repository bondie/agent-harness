name: Guard fuzz

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Deep fuzz of the shell guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GUARD_FUZZ_PROFILE: deep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest tests/test_guard_fuzz.py
