[project]
name = "agent-harness"
version = "0.1.1"
description = "A Claude Code agent team for ticket work (analyse, estimate, implement, review) with an estimator that forecasts hours from similar past tickets, backtested against history."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vladislav Barot", email = "vladislav.barot@gmail.com" }]
requires-python = ">=3.11"
keywords = ["claude-code", "subagents", "effort-estimation", "reference-class-forecasting", "rag", "evaluation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "httpx>=0.27",
    "numpy>=2.0",
    "scipy>=1.13",
    "ticket-precedent",
]

[project.scripts]
harness-eval = "agent_harness.cli:main"

[tool.uv.sources]
ticket-precedent = { git = "https://github.com/bondie/ticket-precedent", rev = "20c14c1e36d916040959442b3a5a6a9b9d81ee73" }

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "scipy-stubs>=1.13",
]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_harness"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET", "C4", "PT", "PTH", "RUF", "S", "N"]
ignore = [
    "S608", # SQL is assembled only from fixed fragments; values are always bound parameters
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["src", "tests", "hooks"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["agent_harness"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
